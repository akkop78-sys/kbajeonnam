<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c2340" />
  <title>조직도 | 전남권투협회</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">KBA</span>
        <span>
          <span class="brand-en">KOREA BOXING ASSOCIATION</span>
          <span class="brand-ko">전남권투협회<small>(사)한국권투협회 전남지회</small></span>
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false">메뉴</button>
      <nav class="nav">
        <a href="../index.html">홈</a>
        <a href="about.html">인사말</a>
        <a class="active" href="organization.html">조직도</a>
        <a href="history.html">역사·챔피언</a>
        <a href="bylaws.html">정관</a>
        <a href="events.html">대회</a>
        <a href="news.html">소식</a>
        <a href="register.html">등록</a>
        <a href="gallery.html">갤러리</a>
        <a href="contact.html">문의</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1>조직도</h1>
      <p>(사)한국권투협회 전남지회 · 발대식 기준 · 사진 있는 임원은 초상 표시</p>
    </div>
  </section>

  <main class="section">
    <div class="container">
      <div class="org-chart reveal" data-org="chart">
        <div class="org-level">
          <div class="org-box is-top">
            <span class="role">회장</span>
            <div class="org-people">
              <div class="org-person">
                <img class="org-president-photo" src="../images/portraits/lee-hyunman-hero.jpg" alt="이현만" width="120" height="150" />
                <span class="who">이현만</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="reveal stack-lg">
        <div class="section-head">
          <p class="section-kicker">BOARD</p>
          <h2 class="section-title">부회장</h2>
        </div>
        <div class="person-grid" data-org="vice-presidents"></div>
      </div>

      <div class="reveal stack-lg">
        <div class="section-head">
          <p class="section-kicker">DIRECTORS</p>
          <h2 class="section-title">이사 · 분장</h2>
        </div>
        <div class="dept-grid" data-org="directors"></div>
      </div>

      <div class="reveal stack-lg">
        <div class="section-head">
          <p class="section-kicker">ADVISORS</p>
          <h2 class="section-title">고문 · 자문</h2>
        </div>
        <div class="org-block">
          <h3>고문위원</h3>
          <div class="person-grid" data-org="honorary-gomun"></div>
        </div>
        <div class="org-block">
          <h3>자문위원</h3>
          <div class="person-grid" data-org="honorary-jamun"></div>
        </div>
      </div>

      <details class="org-source reveal">
        <summary>책자 원본 조직도 보기</summary>
        <figure class="scan-figure" style="margin-top:1rem;box-shadow:none;border:0">
          <img src="../images/org-chart.png" alt="사단법인 한국권투협회 전남지회 조직도 원본" />
        </figure>
      </details>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p class="copyright">© 2026 (사)한국권투협회 전남지회</p></div>
  </footer>
  <script src="../js/main.js"></script>
  <script src="../js/organization.js"></script>
</body>
</html>
